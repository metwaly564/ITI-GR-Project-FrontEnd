<section class="py-16 bg-gray-50">
  <div class="container mx-auto px-4">
    
    <div class="text-center mb-16">
      <h1 class="text-4xl lg:text-5xl font-bold text-gray-800 mb-6">Contact Us</h1>
      <p class="text-xl text-gray-600 max-w-3xl mx-auto">
        Get in touch with us. We're here to help with all your healthcare needs.
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 max-w-6xl mx-auto">
      
      <div class="space-y-8">
        
        <div class="bg-white rounded-2xl p-8 shadow-lg">
          <h3 class="text-2xl font-bold text-gray-800 mb-6">Get in Touch</h3>
          
          <div class="space-y-6">
            
            <div class="flex items-start gap-4">
              <div class="w-12 h-12 bg-[#a5b2d2] rounded-full flex items-center justify-center flex-shrink-0">
                <i class="fas fa-map-marker-alt text-white"></i>
              </div>
              <div>
                <h4 class="font-semibold text-gray-800 mb-1">Address</h4>
                <p class="text-gray-600">123 Healthcare Street<br>Medical District, Cairo, Egypt</p>
              </div>
            </div>

            <div class="flex items-start gap-4">
              <div class="w-12 h-12 bg-[#a5b2d2] rounded-full flex items-center justify-center flex-shrink-0">
                <i class="fas fa-phone text-white"></i>
              </div>
              <div>
                <h4 class="font-semibold text-gray-800 mb-1">Phone</h4>
                <p class="text-gray-600">+20 123 456 7890</p>
              </div>
            </div>

            <div class="flex items-start gap-4">
              <div class="w-12 h-12 bg-[#a5b2d2] rounded-full flex items-center justify-center flex-shrink-0">
                <i class="fas fa-envelope text-white"></i>
              </div>
              <div>
                <h4 class="font-semibold text-gray-800 mb-1">Email</h4>
                <p class="text-gray-600">info@carezone.com</p>
              </div>
            </div>

            <div class="flex items-start gap-4">
              <div class="w-12 h-12 bg-[#a5b2d2] rounded-full flex items-center justify-center flex-shrink-0">
                <i class="fas fa-clock text-white"></i>
              </div>
              <div>
                <h4 class="font-semibold text-gray-800 mb-1">Working Hours</h4>
                <p class="text-gray-600">24/7 - Always here for you</p>
              </div>
            </div>

          </div>
        </div>

        <div class="bg-white rounded-2xl p-8 shadow-lg">
          <h3 class="text-2xl font-bold text-gray-800 mb-6">Follow Us</h3>
          <div class="flex gap-4">
            <a href="#" class="w-12 h-12 bg-gray-700 hover:bg-blue-600 text-white rounded-full flex items-center justify-center transition-all duration-200">
              <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="w-12 h-12 bg-gray-700 hover:bg-pink-600 text-white rounded-full flex items-center justify-center transition-all duration-200">
              <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="w-12 h-12 bg-gray-700 hover:bg-blue-400 text-white rounded-full flex items-center justify-center transition-all duration-200">
              <i class="fab fa-twitter"></i>
            </a>
            <a href="#" class="w-12 h-12 bg-gray-700 hover:bg-blue-700 text-white rounded-full flex items-center justify-center transition-all duration-200">
              <i class="fab fa-linkedin-in"></i>
            </a>
          </div>
        </div>

      </div>

      <div class="bg-white rounded-2xl p-8 shadow-lg">
        <h3 class="text-2xl font-bold text-gray-800 mb-6">Send us a Message</h3>
        
        <form class="space-y-6">
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
              <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#a5b2d2] focus:border-transparent">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
              <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#a5b2d2] focus:border-transparent">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input type="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#a5b2d2] focus:border-transparent">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Subject</label>
            <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#a5b2d2] focus:border-transparent">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Message</label>
            <textarea rows="5" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#a5b2d2] focus:border-transparent"></textarea>
          </div>

          <button type="submit" class="w-full bg-[#a5b2d2] hover:bg-[#8a9bd6] text-white py-3 px-6 rounded-lg font-semibold transition-all duration-200">
            Send Message
          </button>

        </form>
      </div>

    </div>

  </div>
</section>
