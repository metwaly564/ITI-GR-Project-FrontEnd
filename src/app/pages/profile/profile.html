<div class="min-h-screen bg-gradient-to-br from-[var(--color-light-blue)] to-[var(--color-rock-blue)] flex items-center justify-center p-6 relative overflow-hidden">

    <!--✨ Floating Bubbles Background -->
    <div class="absolute inset-0 pointer-events-none">
        <div class="animate-bubbles w-6 h-6 bg-white/40 rounded-full blur-md absolute top-10 left-20"></div>
        <div class="animate-bubbles w-4 h-4 bg-white/30 rounded-full blur-sm absolute top-40 right-10"></div>
        <div class="animate-bubbles w-8 h-8 bg-white/20 rounded-full blur-md absolute bottom-20 left-1/3"></div>
        <div class="animate-bubbles w-5 h-5 bg-white/35 rounded-full blur-md absolute bottom-32 right-1/4"></div>
    </div>

    <!--✨ Main Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md animate-luxury z-[10]">

        <!--✨ Header -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-3 text-2xl font-bold text-[var(--color-rock-blue)] mb-4 animate-bloom">
                <i class="fas fa-user-circle"></i>
                <span>My Profile</span>
            </div>
            <p class="text-gray-600 animate-soft-fade">Manage your account information</p>
        </div>

        <form [formGroup]="profileForm" (ngSubmit)="save()" class="space-y-5">

            <div class="animate-soft-fade">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input formControlName="email" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-100">
            </div>

            <div class="animate-soft-fade" style="animation-delay: .1s">
                <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                <input formControlName="firstName" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[var(--color-rock-blue)] focus:border-transparent transition-all duration-200">
            </div>

            <div class="animate-soft-fade" style="animation-delay: .2s">
                <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                <input formControlName="lastName" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[var(--color-rock-blue)] focus:border-transparent transition-all duration-200">
            </div>

            <div class="animate-soft-fade" style="animation-delay: .3s">
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input formControlName="phoneNumber" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[var(--color-rock-blue)] focus:border-transparent transition-all duration-200">
            </div>

            <button type="submit" class="w-full bg-[var(--color-rock-blue)] hover:bg-[var(--color-light-blue)] text-white py-3 px-4 rounded-lg font-semibold transition-all duration-200 transform hover:scale-105 focus:ring-4 focus:ring-[var(--color-light-blue)] animate-soft-glow glow-hover">
                Save Changes
            </button>

        </form>
    </div>
</div>
